name: Deploy ZX_Blazor to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'ZX_Blazor/**'
      - 'SpectrumPC/**'
      - 'Tests/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and publish Blazor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test core
        run: dotnet test Tests/ZXSharp.Tests/ZXSharp.Tests.csproj -c Release

      - name: Publish Blazor
        run: dotnet publish ZX_Blazor/ZX_Blazor.csproj -c Release -o published

      - name: Locate published static site and configure Pages path
        id: prepare
        shell: bash
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path('published')
          indexes = sorted(root.rglob('index.html'))
          print('Publish output files:', *[str(p) for p in root.rglob('*') if p.is_file()][:60], sep='\n  ')
          if len(indexes) != 1:
              raise SystemExit(f'Expected exactly one published index.html; found: {indexes}')
          index = indexes[0]
          site_dir = index.parent
          html = index.read_text(encoding='utf-8')
          original = '<base href="/" />'
          if html.count(original) != 1:
              raise SystemExit(f'Unexpected base href in {index}')
          html = html.replace(original, f'<base href="/{os.environ["REPOSITORY_NAME"]}/" />')
          index.write_text(html, encoding='utf-8')
          (site_dir / '.nojekyll').touch()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'site_path={site_dir}\n')
          print(f'Pages static site directory: {site_dir}')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.prepare.outputs.site_path }}

  deploy:
    name: Deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
