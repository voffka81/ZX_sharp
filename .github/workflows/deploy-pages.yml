name: Deploy ZX_Blazor to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'ZX_Blazor/**'
      - 'SpectrumPC/**'
      - 'Tests/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and publish Blazor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test core
        run: dotnet test Tests/ZXSharp.Tests/ZXSharp.Tests.csproj -c Release

      - name: Publish Blazor
        run: dotnet publish ZX_Blazor/ZX_Blazor.csproj -c Release -o published

      - name: Set GitHub Pages base path and disable Jekyll
        shell: bash
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          index = Path('published/index.html')
          html = index.read_text(encoding='utf-8')
          original = '<base href="/" />'
          assert html.count(original) == 1, "Unexpected base href in published index.html"
          html = html.replace(original, f'<base href="/{os.environ["REPOSITORY_NAME"]}/" />')
          index.write_text(html, encoding='utf-8')
          Path('published/.nojekyll').touch()
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: published

  deploy:
    name: Deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
